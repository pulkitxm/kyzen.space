name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Biome (format + imports + lint)
        run: bun run check
      - name: Tailwind canonical classes
        run: bun run fix:tw:check
      - name: Type-check
        run: bun run type-check
