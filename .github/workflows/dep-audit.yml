name: Dependency audit

on:
  pull_request:
    paths:
      - "bun.lock"
      - "package.json"
      - "**/package.json"
  push:
    branches: [main]
    paths:
      - "bun.lock"
      - "package.json"
      - "**/package.json"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dep-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Audit dependencies for high and critical vulnerabilities
        run: bun audit --audit-level=high
