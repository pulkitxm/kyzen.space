name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/architecture/**"
      - "docs/games/**"
      - "docs/adding-a-game.md"
      - "docs/video-tutorials.md"
      - "scripts/sync-wiki.mjs"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PUKBOT_CLIENT_ID }}
          private-key: ${{ secrets.PUKBOT_PRIVATE_KEY }}
          owner: pulkitxm
          repositories: kyzen.space
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun scripts/sync-wiki.mjs --push
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: "pukbot[bot]"
          GIT_AUTHOR_EMAIL: "320458784+pukbot[bot]@users.noreply.github.com"
