name: No code comments

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check for disallowed code comments
        run: bun run strip-comments -- --check
