name: CI feedback

on:
  workflow_run:
    workflows:
      - Build
      - Lint
      - Test
      - Dead code
      - No code comments
      - No em dashes
      - No leftovers
      - No secrets
      - Dependency audit
      - Smoke
      - Workflow lint
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: ci-feedback-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PUKBOT_CLIENT_ID }}
          private-key: ${{ secrets.PUKBOT_PRIVATE_KEY }}
          owner: pulkitxm
          repositories: kyzen.space
          permission-actions: read
          permission-issues: write
          permission-pull-requests: read
      - uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const marker = `<!-- ci-feedback:${run.name} -->`;

            let prNumber = run.pull_requests?.[0]?.number;
            if (!prNumber) {
              const { data: prs } = await github.rest.pulls.list({
                owner,
                repo,
                state: "open",
                head: `${owner}:${run.head_branch}`,
                per_page: 1,
              });
              prNumber = prs[0]?.number;
            }
            if (!prNumber) {
              core.info("No open PR found for this run; nothing to do.");
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            const shortSha = run.head_sha.slice(0, 7);

            if (run.conclusion === "success") {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body: `${marker}\n✅ **${run.name}** is passing again as of ${shortSha}.`,
                });
              }
              return;
            }
            if (run.conclusion !== "failure") return;

            const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: run.id,
              filter: "latest",
              per_page: 50,
            });
            const failedJobs = jobsData.jobs.filter((j) => j.conclusion === "failure");

            const repro = {
              "Build": "bun run build",
              "Lint": "bun run check && bun run fix:tw:check && bun run type-check",
              "Test": "bun run test (integration: bun run db:start, then cd apps/server && bun run test:integration)",
              "Dead code": "bun run dead-code",
              "No code comments": "bun run strip-comments -- --check",
              "No em dashes": "see .github/workflows/no-em-dashes.yml",
              "No leftovers": "run the failing step's git grep from .github/workflows/no-leftovers.yml",
              "No secrets": "gitleaks dir . (https://github.com/gitleaks/gitleaks)",
              "Dependency audit": "bun audit --audit-level=high",
              "Smoke": "bun run build, start apps/server and apps/web, then curl /health and /",
              "Workflow lint": "actionlint (https://github.com/rhysd/actionlint)",
            };

            const sections = [];
            for (const job of failedJobs) {
              const failedSteps = (job.steps || [])
                .filter((s) => s.conclusion === "failure")
                .map((s) => `\`${s.name}\``)
                .join(", ");
              let tail = "";
              try {
                const logRes = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner,
                  repo,
                  job_id: job.id,
                });
                tail = String(logRes.data)
                  .split("\n")
                  .map((line) => line.replace(/^\S+T\S+Z ?/, ""))
                  .filter((line) => line.trim().length > 0)
                  .slice(-60)
                  .join("\n");
                if (tail.length > 6000) tail = tail.slice(-6000);
              } catch (e) {
                tail = `(could not fetch logs: ${e.message})`;
              }
              sections.push(
                `**Job \`${job.name}\`** failed at step ${failedSteps || "(unknown)"}:\n\n` +
                  "```text\n" + tail + "\n```",
              );
            }

            const reproLine = repro[run.name]
              ? `\nReproduce locally: \`${repro[run.name]}\`\n`
              : "";
            let body =
              `${marker}\n### ❌ ${run.name} failed on ${shortSha}\n\n` +
              sections.join("\n\n") +
              `\n${reproLine}\n[Full run](${run.html_url})`;
            if (body.length > 60000) body = body.slice(0, 60000) + "\n... (truncated)";

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }
