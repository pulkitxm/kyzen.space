services:
  postgres:
    image: postgres:16
    container_name: gamelobby-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gamelobby
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gamelobby"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Enables the Socket.IO redis-adapter and the Redis-backed presence store.
  redis:
    image: redis:7
    container_name: gamelobby-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    restart: unless-stopped

volumes:
  pg_data:
