services:
  postgres:
    image: postgres:16
    container_name: gamelobby-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gamelobby
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gamelobby"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Optional: enables the Socket.IO redis-adapter for multi-instance scale-out.
  redis:
    image: redis:7
    container_name: gamelobby-redis
    profiles:
      - redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    restart: unless-stopped

  # Lightweight DB UI: `bun run db:studio`
  adminer:
    image: adminer:latest
    container_name: gamelobby-adminer
    profiles:
      - studio
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:${ADMINER_HOST_PORT:-18081}:8080"
    restart: unless-stopped

volumes:
  pg_data:
