services:
  mongo:
    image: mongo:7
    container_name: samaan-mongo
    ports:
      - "27027:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    container_name: samaan-mongo-express
    profiles:
      - studio
    depends_on:
      - mongo
    ports:
      - "127.0.0.1:18081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/samaan
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH: "false"
    restart: unless-stopped

volumes:
  mongo_data:

