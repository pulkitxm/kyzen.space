<defs>
    <radialGradient id="card" cx="50%" cy="36%" r="85%"><stop offset="0%" stop-color="#FFFDF7"/><stop offset="62%" stop-color="#F8F1E1"/><stop offset="100%" stop-color="#EEE2C8"/></radialGradient>
