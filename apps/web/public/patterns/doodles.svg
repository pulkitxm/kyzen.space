<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" fill="none">
  <!--
    Seamless doodle tile. Used purely as a CSS mask (mask-mode: alpha), so the
    stroke colour here is irrelevant — only the alpha of the strokes matters.
    The visible line colour comes from the masking element's background-color
    (a per-theme token), and the page colour sits underneath. Every icon is
    kept clear of the tile edges so `repeat` never clips a glyph -> no seams.
  -->
  <defs>
    <g id="dl-star">
      <path d="M0,-13 L2.9,-4 L12.4,-4 L4.8,1.6 L7.6,10.5 L0,5 L-7.6,10.5 L-4.8,1.6 L-12.4,-4 L-2.9,4 Z" />
    </g>
    <g id="dl-heart">
      <path d="M0,10 C-10,1 -12,-6 -5,-9 C-1,-11 0,-6 0,-4 C0,-6 1,-11 5,-9 C12,-6 10,1 0,10 Z" />
    </g>
    <g id="dl-smiley">
      <circle r="12" />
      <circle cx="-4.5" cy="-3" r="1.6" fill="#000" stroke="none" />
      <circle cx="4.5" cy="-3" r="1.6" fill="#000" stroke="none" />
      <path d="M-6,3.5 Q0,9.5 6,3.5" />
    </g>
    <g id="dl-note">
      <path d="M-2,8 L-2,-9 L11,-12 L11,4" />
      <ellipse cx="-6" cy="8" rx="4.5" ry="3.3" />
      <ellipse cx="7" cy="4" rx="4.5" ry="3.3" />
    </g>
    <g id="dl-bolt">
      <path d="M3,-13 L-6,2 L0,2 L-3,13 L9,-3 L2,-3 Z" />
    </g>
    <g id="dl-cloud">
      <path d="M-11,5 a6,6 0 0,1 1.5,-11.5 a8,8 0 0,1 15,1 a5,5 0 0,1 -1,10.5 Z" />
    </g>
    <g id="dl-moon">
      <path d="M6,-11 a12,12 0 1,0 7,19 a9.5,9.5 0 1,1 -7,-19 Z" />
    </g>
    <g id="dl-sun">
      <circle r="5" />
      <path d="M0,-7 L0,-12 M0,7 L0,12 M-7,0 L-12,0 M7,0 L12,0 M5,-5 L8.5,-8.5 M-5,-5 L-8.5,-8.5 M5,5 L8.5,8.5 M-5,5 L-8.5,8.5" />
    </g>
    <g id="dl-diamond">
      <path d="M0,-12 L9,0 L0,12 L-9,0 Z" />
    </g>
    <g id="dl-plus">
      <path d="M0,-9 L0,9 M-9,0 L9,0" />
    </g>
    <g id="dl-triangle">
      <path d="M0,-11 L10,8 L-10,8 Z" />
    </g>
    <g id="dl-drop">
      <path d="M0,-12 C7,-2 7,9 0,9 C-7,9 -7,-2 0,-12 Z" />
    </g>
    <g id="dl-flower">
      <circle r="3" />
      <circle cx="0" cy="-7" r="4" />
      <circle cx="6.66" cy="-2.16" r="4" />
      <circle cx="4.11" cy="5.66" r="4" />
      <circle cx="-4.11" cy="5.66" r="4" />
      <circle cx="-6.66" cy="-2.16" r="4" />
    </g>
    <g id="dl-leaf">
      <path d="M0,-12 C8,-6 8,6 0,12 C-8,6 -8,-6 0,-12 Z" />
      <path d="M0,-9 L0,10" />
    </g>
    <g id="dl-gift">
      <rect x="-9" y="-3" width="18" height="14" rx="1.5" />
      <rect x="-11" y="-8" width="22" height="5" rx="1.5" />
      <path d="M0,-8 L0,11" />
      <path d="M0,-8 C-4,-13 -8,-9 0,-8 C8,-9 4,-13 0,-8 Z" />
    </g>
    <g id="dl-balloon">
      <ellipse cx="0" cy="-4" rx="7" ry="9" />
      <path d="M-2,5 L0,8 L2,5 Z" />
      <path d="M0,8 Q2,11 0,13" />
    </g>
    <g id="dl-key">
      <circle cx="-6" cy="-6" r="4" />
      <path d="M-3,-3 L8,8 M8,8 L11,5 M6,6 L9,3" />
    </g>
    <g id="dl-rocket">
      <path d="M0,-12 C5,-6 5,4 3,9 L-3,9 C-5,4 -5,-6 0,-12 Z" />
      <path d="M-3,7 L-7,12 L-3,5" />
      <path d="M3,7 L7,12 L3,5" />
      <circle cx="0" cy="-3" r="2" />
    </g>
    <g id="dl-eye">
      <path d="M-11,0 C-4,-7 4,-7 11,0 C4,7 -4,7 -11,0 Z" />
      <circle cx="0" cy="0" r="3" />
    </g>
    <g id="dl-clover">
      <circle cx="0" cy="-4" r="4" />
      <circle cx="-4" cy="3" r="4" />
      <circle cx="4" cy="3" r="4" />
      <path d="M0,5 L0,12" />
    </g>
    <g id="dl-snow">
      <path d="M0,-11 L0,11 M-9.5,-5.5 L9.5,5.5 M-9.5,5.5 L9.5,-5.5" />
      <path d="M0,-11 L-3,-8 M0,-11 L3,-8 M0,11 L-3,8 M0,11 L3,8" />
    </g>
    <g id="dl-anchor">
      <circle cx="0" cy="-9" r="2.5" />
      <path d="M0,-6 L0,9" />
      <path d="M-5,-2 L5,-2" />
      <path d="M-8,3 Q-8,9 0,9 Q8,9 8,3" />
    </g>
  </defs>

  <g stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <use href="#dl-star" transform="translate(36,36) rotate(-12)" />
    <use href="#dl-heart" transform="translate(108,30) rotate(8)" />
    <use href="#dl-note" transform="translate(180,40)" />
    <use href="#dl-bolt" transform="translate(252,34) rotate(6)" />
    <use href="#dl-cloud" transform="translate(324,40)" />

    <use href="#dl-moon" transform="translate(40,108) rotate(10)" />
    <use href="#dl-sun" transform="translate(108,112)" />
    <use href="#dl-diamond" transform="translate(180,104) rotate(12)" />
    <use href="#dl-leaf" transform="translate(252,110) rotate(-15)" />
    <use href="#dl-smiley" transform="translate(320,108)" />

    <use href="#dl-triangle" transform="translate(36,182) rotate(8)" />
    <use href="#dl-flower" transform="translate(112,180)" />
    <use href="#dl-plus" transform="translate(180,176) rotate(20)" />
    <use href="#dl-heart" transform="translate(248,184) rotate(-10)" />
    <use href="#dl-star" transform="translate(324,180) rotate(18)" />

    <use href="#dl-drop" transform="translate(40,252)" />
    <use href="#dl-smiley" transform="translate(108,250)" />
    <use href="#dl-cloud" transform="translate(184,256)" />
    <use href="#dl-note" transform="translate(252,250) rotate(-8)" />
    <use href="#dl-moon" transform="translate(322,252) rotate(-20)" />

    <use href="#dl-sun" transform="translate(36,324)" />
    <use href="#dl-diamond" transform="translate(110,326) rotate(-12)" />
    <use href="#dl-bolt" transform="translate(180,320) rotate(-6)" />
    <use href="#dl-flower" transform="translate(252,324)" />
    <use href="#dl-leaf" transform="translate(322,322) rotate(12)" />

    <!-- Interleaved second layer (offset grid) for a denser, more organic scatter. -->
    <use href="#dl-gift" transform="translate(72,74) rotate(-8)" />
    <use href="#dl-balloon" transform="translate(144,70)" />
    <use href="#dl-key" transform="translate(216,76) rotate(12)" />
    <use href="#dl-rocket" transform="translate(288,72) rotate(10)" />

    <use href="#dl-eye" transform="translate(74,146)" />
    <use href="#dl-clover" transform="translate(146,144)" />
    <use href="#dl-snow" transform="translate(216,148)" />
    <use href="#dl-anchor" transform="translate(288,146) rotate(-6)" />

    <use href="#dl-rocket" transform="translate(72,216) rotate(-12)" />
    <use href="#dl-gift" transform="translate(144,218) rotate(6)" />
    <use href="#dl-clover" transform="translate(216,214)" />
    <use href="#dl-key" transform="translate(288,218) rotate(-10)" />

    <use href="#dl-snow" transform="translate(72,288)" />
    <use href="#dl-eye" transform="translate(144,286)" />
    <use href="#dl-balloon" transform="translate(216,290) rotate(8)" />
    <use href="#dl-anchor" transform="translate(288,288) rotate(10)" />
  </g>
</svg>
