<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none">
  <!--
    Seamless game-themed doodle tile. Used as a CSS mask (alpha), so the stroke
    colour is irrelevant — only the alpha matters. Every glyph stays clear of the
    tile edges so `repeat` never clips one -> no seams.
  -->
  <defs>
    <g id="gm-die">
      <rect x="-11" y="-11" width="22" height="22" rx="4" />
      <circle cx="-5" cy="-5" r="1.6" fill="#000" stroke="none" />
      <circle cx="5" cy="-5" r="1.6" fill="#000" stroke="none" />
      <circle cx="0" cy="0" r="1.6" fill="#000" stroke="none" />
      <circle cx="-5" cy="5" r="1.6" fill="#000" stroke="none" />
      <circle cx="5" cy="5" r="1.6" fill="#000" stroke="none" />
    </g>
    <g id="gm-pad">
      <rect x="-15" y="-8" width="30" height="16" rx="8" />
      <path d="M-9,0 L-3,0 M-6,-3 L-6,3" />
      <circle cx="6" cy="-2" r="1.8" fill="#000" stroke="none" />
      <circle cx="9.5" cy="2" r="1.8" fill="#000" stroke="none" />
    </g>
    <g id="gm-card">
      <rect x="-9" y="-12" width="18" height="24" rx="2.5" />
      <path d="M0,5 C-5,0 -6,-4 -3,-6 C-1,-7 0,-4 0,-3 C0,-4 1,-7 3,-6 C6,-4 5,0 0,5 Z" />
    </g>
    <g id="gm-pawn">
      <circle cx="0" cy="-7" r="3.5" />
      <path d="M-6,12 L6,12 L3.5,1 C6,-1 5,-4 1.5,-4 L-1.5,-4 C-5,-4 -6,-1 -3.5,1 Z" />
      <path d="M-5,7 L5,7" />
    </g>
    <g id="gm-trophy">
      <path d="M-7,-9 L7,-9 C7,-1 -7,-1 -7,-9 Z" />
      <path d="M-7,-8 C-12,-7 -12,-2 -8,-3" />
      <path d="M7,-8 C12,-7 12,-2 8,-3" />
      <path d="M0,-1 L0,7" />
      <path d="M-5,10 L5,10 L4,7 L-4,7 Z" />
    </g>
    <g id="gm-joystick">
      <ellipse cx="0" cy="9" rx="9" ry="3" />
      <path d="M0,8 L0,-4" />
      <circle cx="0" cy="-7" r="4" />
    </g>
    <g id="gm-target">
      <circle r="10" />
      <circle r="6" />
      <circle r="2" fill="#000" stroke="none" />
    </g>
    <g id="gm-crown">
      <path d="M-10,7 L-10,-4 L-5,1 L0,-8 L5,1 L10,-4 L10,7 Z" />
      <path d="M-10,10 L10,10" />
    </g>
    <g id="gm-heart">
      <path d="M0,10 C-10,1 -12,-6 -5,-9 C-1,-11 0,-6 0,-4 C0,-6 1,-11 5,-9 C12,-6 10,1 0,10 Z" />
    </g>
  </defs>

  <g stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <use href="#gm-die" transform="translate(40,40) rotate(-10)" />
    <use href="#gm-pad" transform="translate(120,36)" />
    <use href="#gm-card" transform="translate(200,40) rotate(8)" />
    <use href="#gm-trophy" transform="translate(280,42)" />

    <use href="#gm-joystick" transform="translate(40,120)" />
    <use href="#gm-target" transform="translate(120,116)" />
    <use href="#gm-crown" transform="translate(200,120) rotate(-6)" />
    <use href="#gm-pawn" transform="translate(280,118)" />

    <use href="#gm-card" transform="translate(40,200) rotate(-12)" />
    <use href="#gm-heart" transform="translate(120,202)" />
    <use href="#gm-die" transform="translate(200,196) rotate(14)" />
    <use href="#gm-joystick" transform="translate(280,200)" />

    <use href="#gm-crown" transform="translate(40,280) rotate(6)" />
    <use href="#gm-pawn" transform="translate(120,282)" />
    <use href="#gm-target" transform="translate(200,278)" />
    <use href="#gm-pad" transform="translate(280,280) rotate(-8)" />
  </g>
</svg>
